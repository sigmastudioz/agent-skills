<svg xmlns="http://www.w3.org/2000/svg" width="760" height="454" viewBox="0 0 760 454" role="img" aria-labelledby="t d">
<title id="t">Slipstream: same work, a fraction of the tokens</title>
<desc id="d">Without vs with Slipstream. Startup context 119K vs 42K tokens. Input per task 207K vs 88K. Right skill picked 7 of 8 vs 8 of 8. Real-call replays: Claude Code input 100% vs 34%, Codex 100% vs 54%.</desc>
<style>
.s{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.g{stroke:#e4e3df}.w{fill:#2a78d6}.o{fill:#eb6834}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.s{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.g{stroke:#383835}.w{fill:#3987e5}.o{fill:#d95926}}
</style><rect class="s" width="760" height="454" rx="12"/>
<text class="t1" x="24" y="40" font-size="22" font-weight="700">Same work, a fraction of the tokens</text>
<text class="t2" x="24" y="62" font-size="13">Publisher's own setup. Measured unless marked replay; replays re-price real calls.</text>
<rect class="o" x="24" y="80" width="12" height="12" rx="2"/><text class="t2" x="42" y="90" font-size="12">Without Slipstream</text>
<rect class="w" x="170" y="80" width="12" height="12" rx="2"/><text class="t2" x="188" y="90" font-size="12">With Slipstream</text>
<text class="t1" x="24" y="130" font-size="14" font-weight="600">Startup context, re-sent on every call</text><text class="t2" x="24" y="148" font-size="12">measured, headless claude -p</text><path class="o" d="M300 118h286.0a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-286.0z"><title>Without Slipstream: 119K tokens</title></path><text class="t2" x="598.0" y="129" font-size="12">119K tokens</text><path class="w" d="M300 134h98.40382762290206a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-98.40382762290206z"><title>With Slipstream: 42K tokens</title></path><text class="t1" x="410.40382762290204" y="145" font-size="12" font-weight="600">42K tokens</text><text class="t1" x="736" y="140" font-size="18" font-weight="700" text-anchor="end">−65%</text><line class="g" x1="24" x2="736" y1="166" y2="166" stroke-width="1"/><text class="t1" x="24" y="192" font-size="14" font-weight="600">Input tokens per task</text><text class="t2" x="24" y="210" font-size="12">8 unseen tasks, average</text><path class="o" d="M300 180h286.0a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-286.0z"><title>Without Slipstream: 207K tokens</title></path><text class="t2" x="598.0" y="191" font-size="12">207K tokens</text><path class="w" d="M300 196h119.75454763456558a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-119.75454763456558z"><title>With Slipstream: 88K tokens</title></path><text class="t1" x="431.7545476345656" y="207" font-size="12" font-weight="600">88K tokens</text><text class="t1" x="736" y="202" font-size="18" font-weight="700" text-anchor="end">−57%</text><line class="g" x1="24" x2="736" y1="228" y2="228" stroke-width="1"/><text class="t1" x="24" y="254" font-size="14" font-weight="600">Right skill picked (higher is better)</text><text class="t2" x="24" y="272" font-size="12">same 8 unseen tasks</text><path class="o" d="M300 242h249.75a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-249.75z"><title>Without Slipstream: 7 of 8</title></path><text class="t2" x="561.75" y="253" font-size="12">7 of 8</text><path class="w" d="M300 258h286.0a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-286.0z"><title>With Slipstream: 8 of 8</title></path><text class="t1" x="598.0" y="269" font-size="12" font-weight="600">8 of 8</text><text class="t1" x="736" y="264" font-size="18" font-weight="700" text-anchor="end">+1</text><line class="g" x1="24" x2="736" y1="290" y2="290" stroke-width="1"/><text class="t1" x="24" y="316" font-size="14" font-weight="600">Two weeks of real Claude Code calls</text><text class="t2" x="24" y="334" font-size="12">replay of input tokens</text><path class="o" d="M300 304h286.0a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-286.0z"><title>Without Slipstream: 100%</title></path><text class="t2" x="598.0" y="315" font-size="12">100%</text><path class="w" d="M300 320h93.73a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-93.73z"><title>With Slipstream: 34%</title></path><text class="t1" x="405.73" y="331" font-size="12" font-weight="600">34%</text><text class="t1" x="736" y="326" font-size="18" font-weight="700" text-anchor="end">−66%</text><line class="g" x1="24" x2="736" y1="352" y2="352" stroke-width="1"/><text class="t1" x="24" y="378" font-size="14" font-weight="600">Two weeks of real Codex calls</text><text class="t2" x="24" y="396" font-size="12">replay of input tokens</text><path class="o" d="M300 366h286.0a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-286.0z"><title>Without Slipstream: 100%</title></path><text class="t2" x="598.0" y="377" font-size="12">100%</text><path class="w" d="M300 382h153.47a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-153.47z"><title>With Slipstream: 54%</title></path><text class="t1" x="465.47" y="393" font-size="12" font-weight="600">54%</text><text class="t1" x="736" y="388" font-size="18" font-weight="700" text-anchor="end">−46%</text><line class="g" x1="24" x2="736" y1="414" y2="414" stroke-width="1"/>
<text class="t2" x="24" y="442" font-size="11">Each row has its own scale. Change column: with vs without.</text>
</svg>